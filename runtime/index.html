<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LavaScript WebAssembly Runtime</title>
</head>
<body>
  <h1>LavaScript</h1>
  <p>WebAssembly runtime demo. Build an <code>out.wasm</code> module and place it beside this file.</p>
  <pre id="output"></pre>
  <script>
    const output = document.getElementById("output");
    let wasmInstance = null;

    const imports = {
      lavascript: {
        print_i32(value) {
          output.textContent += `${value}\n`;
          console.log(value);
        },
        print_string(ptr, len) {
          if (!wasmInstance) throw new Error("Wasm instance is not ready");
          const bytes = new Uint8Array(wasmInstance.exports.memory.buffer, ptr, len);
          const text = new TextDecoder().decode(bytes);
          output.textContent += `${text}\n`;
          console.log(text);
        }
      }
    };

    async function run() {
      try {
        const result = await WebAssembly.instantiateStreaming(fetch("out.wasm"), imports);
        wasmInstance = result.instance;
        if (typeof wasmInstance.exports.main !== "function") throw new Error("Wasm module does not export main");
        wasmInstance.exports.main();
      } catch (error) {
        output.textContent = `Runtime error: ${error}`;
        console.error(error);
      }
    }

    run();
  </script>
</body>
</html>
