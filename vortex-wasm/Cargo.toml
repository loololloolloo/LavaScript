[package]
name = "vortex-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vortex-wasm"
path = "src/main.rs"

[features]
default = []
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { version = "0.19.1", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
