<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vortex</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #vortex-canvas { display:block; width:100%; height:100%; outline:none; }
    #boot { position:fixed; inset:0; display:grid; place-items:center; color:#fff; font:14px system-ui; background:#080b10; }
  </style>
</head>
<body>
  <div id="boot">Loading Vortex WASM…</div>
  <canvas id="vortex-canvas" tabindex="0"></canvas>
  <script type="module">
    import init from './vortex_wasm.js';
    try {
      await init();
      document.querySelector('#boot')?.remove();
      document.querySelector('#vortex-canvas')?.focus();
    } catch (error) {
      document.querySelector('#boot').textContent = `Vortex failed to start: ${error}`;
      console.error(error);
    }
  </script>
</body>
</html>
